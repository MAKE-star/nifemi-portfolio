<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#101a2c;--ink:#eee8da;--mute:#a7a79f;--acc2:#c8a45d}}
:root[data-theme="dark"]{--paper:#101a2c;--ink:#eee8da;--mute:#a7a79f;--acc2:#c8a45d}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--sans);line-height:1.65;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--night);z-index:90}
.mono{font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase;font-size:11px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
section{position:relative;padding:112px 0}
.dark{background:var(--night);color:var(--cream)}.light{background:var(--paper);color:var(--ink)}.light2{background:var(--paper2);color:var(--ink)}
.eyebrow{color:var(--gold);margin-bottom:18px;display:block}.light .eyebrow,.light2 .eyebrow{color:var(--acc2)}
h2{font-family:var(--serif);font-weight:300;font-size:clamp(36px,6vw,72px);line-height:1.05;margin:0 0 34px;letter-spacing:-.01em}
h2 em{font-style:italic;font-weight:600;color:var(--gold)}.light h2 em,.light2 h2 em{color:var(--acc2)}
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s,transform .9s}.rv.in{opacity:1;transform:none}
#ld{position:fixed;inset:0;background:var(--night);z-index:100;display:grid;place-items:center;color:var(--cream);transition:opacity .7s,visibility .7s}
#ld.off{opacity:0;visibility:hidden}#ld .box{width:min(280px,76vw);text-align:center}#ld .lg{font-family:var(--serif);font-size:44px;font-weight:300;letter-spacing:.08em}
#ld .ln{height:1px;background:#ffffff22;margin:18px 0 10px}#ld .ln i{display:block;height:100%;width:0;background:var(--gold)}#ld .mono{color:#ffffff77}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:16px 28px;background:linear-gradient(var(--night),#0000)}
nav .logo{font-family:var(--serif);font-size:21px;color:var(--cream);text-decoration:none;letter-spacing:.06em}
nav .lk{display:flex;gap:28px;align-items:center}nav a{color:#f6f4eacc;text-decoration:none}nav a:hover{color:var(--gold)}
nav .cta{border:1px solid var(--gold);padding:8px 16px;color:var(--gold)}
@media(max-width:760px){nav .lk a:not(.cta){display:none}}
#prog{position:fixed;top:0;left:0;height:2px;background:var(--gold);width:0;z-index:95}
#home{min-height:100vh;display:flex;align-items:center;padding:130px 0 90px;overflow:hidden;background:radial-gradient(640px circle at var(--mx,72%) var(--my,40%),#c8a45d1f,transparent 60%),var(--night)}
.hgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:36px;align-items:center}@media(max-width:900px){.hgrid{grid-template-columns:1fr}}
.hello{color:var(--gold);margin-bottom:20px}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(46px,8.6vw,118px);line-height:.98;margin:0;letter-spacing:-.02em}
h1 .l2{display:block;font-weight:600;font-style:italic;color:var(--gold)}
.role{margin:28px 0 10px;font-size:clamp(18px,2.2vw,24px);color:#f6f4eacc}.role b{font-weight:500;border-left:2px solid var(--gold);padding-left:12px;margin-left:10px;color:var(--cream)}
.meta{color:#f6f4ea99}.meta .ok{color:#8fc9a0}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.btn{font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;font-size:12px;padding:15px 24px;border:1px solid var(--gold);color:var(--gold);text-decoration:none;cursor:pointer;background:none;transition:.25s}
.btn.fill{background:var(--gold);color:#1b1405;font-weight:500}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px #0005}
.ticks{margin-top:36px;display:grid;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#f6f4ea88}
.ticks div{display:flex;gap:14px;align-items:center}.ticks i{width:40px;height:1px;background:var(--gold)}.ticks b{color:var(--cream);font-weight:500}
.badgeW{display:grid;place-items:center;min-height:400px;position:relative}
#badge{width:min(290px,78vw);background:linear-gradient(160deg,#16294a,#0a1426);border:1px solid #c8a45d55;border-radius:6px;padding:16px;transform:rotate(3deg);box-shadow:0 30px 60px #0008;touch-action:none;user-select:none;cursor:grab}
#badge .top{display:flex;justify-content:space-between;color:var(--gold);margin-bottom:12px}
.ph{aspect-ratio:1/1;background:linear-gradient(135deg,#22365a,#12203a);position:relative;overflow:hidden;display:grid;place-items:center;font-family:var(--serif);font-size:60px;font-weight:300;color:var(--gold);border-radius:3px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .hint{display:none;position:absolute;bottom:0;left:0;right:0;background:#000b;color:#fff;padding:8px;text-align:center;z-index:2}
.editing .ph{cursor:pointer;outline:2px dashed var(--gold);outline-offset:3px}.editing .ph .hint{display:block}
#badge .nm{font-family:var(--serif);font-size:22px;margin-top:14px;color:var(--cream)}#badge .sm{color:#f6f4ea99;margin-top:2px}
.drag{position:absolute;right:0;bottom:0;color:#f6f4ea55}
.big{font-family:var(--serif);font-weight:300;font-size:clamp(28px,4.2vw,50px);line-height:1.2;max-width:24ch;margin:0 0 34px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:44px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.two p{font-size:18px;color:var(--mute);margin:0}
.ms{border-top:1px solid #14213a30;padding:44px 0;display:grid;grid-template-columns:90px 1fr;gap:24px}
.ms .no{font-family:var(--serif);font-size:52px;font-weight:300;color:var(--acc2);line-height:1}
.ms h3{font-family:var(--serif);font-size:clamp(26px,3.6vw,40px);font-weight:600;margin:0 0 6px}
.ms .co{color:var(--mute);margin-bottom:8px}.tag{display:inline-block;border:1px solid var(--acc2);color:var(--acc2);padding:4px 10px;margin:4px 0 16px}
.ms ul{padding:0;margin:0;list-style:none;display:grid;gap:10px}.ms li{padding-left:24px;position:relative;font-size:17px}.ms li::before{content:"";position:absolute;left:0;top:.7em;width:10px;height:1px;background:var(--acc2)}
@media(max-width:600px){.ms{grid-template-columns:1fr}.ms .no{font-size:36px}}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));border-top:1px solid #f6f4ea22;border-left:1px solid #f6f4ea22}
.sg div{padding:46px 22px;border-right:1px solid #f6f4ea22;border-bottom:1px solid #f6f4ea22;text-align:center}
.sg b{display:block;font-family:var(--serif);font-weight:300;font-size:clamp(44px,5.6vw,76px);line-height:1}.sg .mono{opacity:.65;display:block;margin-top:14px}
.tk{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.tk .c{background:var(--paper);color:var(--ink);border:1px solid #14213a1f;padding:28px;transition:.3s;border-radius:4px}.tk .c:hover{transform:translateY(-5px);box-shadow:0 18px 40px #0002;border-color:var(--gold)}
.tk h4{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 14px}.tk .ch{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;border:1px solid #14213a30;padding:5px 12px;border-radius:99px}
.mq{overflow:hidden;border-block:1px solid #f6f4ea22;padding:22px 0;background:var(--night2);color:var(--cream)}
.mq .tr{display:flex;gap:48px;width:max-content;animation:mq 40s linear infinite;font-family:var(--serif);font-size:26px;font-weight:300}
.mq .tr span:nth-child(odd){color:var(--gold)}@keyframes mq{to{transform:translateX(-50%)}}
.er{border-top:1px solid #14213a30;padding:20px 0;font-size:20px;font-family:var(--serif)}
#contact{text-align:center;padding:140px 0 150px;background:radial-gradient(700px circle at 50% 70%,#c8a45d1f,transparent 60%),var(--night);color:var(--cream)}
#contact h2{font-size:clamp(44px,8.6vw,112px);font-weight:300;line-height:1}#contact h2 em{display:block}
#contact p{color:#f6f4eaaa;max-width:520px;margin:0 auto 10px;font-size:18px}
.bd{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:48px 0 8px}
.bd div{border:1px solid #f6f4ea22;padding:14px 20px;min-width:160px;opacity:.4;transition:.5s;text-align:left}.bd div.on{opacity:1;border-color:var(--gold)}.bd .e{display:block;color:var(--gold)}.bd small{display:block;opacity:.6;font-size:12px}
footer{background:var(--night);color:#f6f4ea66;text-align:center;padding:26px 20px 100px}
#pill{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:#0b1d36ee;backdrop-filter:blur(10px);color:var(--cream);border:1px solid #f6f4ea2a;border-radius:99px;padding:8px 10px 8px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 12px 40px #0006}
#pill .lv{background:var(--gold);color:#1b1405;padding:6px 12px;border-radius:99px}#pill .xb{width:70px;height:3px;background:#f6f4ea33;border-radius:9px;overflow:hidden}#pill .xb i{display:block;height:100%;width:0;background:var(--gold);transition:width .5s}
@media(max-width:520px){#pill .sec{display:none}}
#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-200%);background:var(--gold);color:#1b1405;padding:12px 20px;border-radius:99px;z-index:96;transition:transform .4s;max-width:90vw;text-align:center}#toast.show{transform:translate(-50%,0)}
#edbar{position:fixed;right:14px;top:calc(70px + env(safe-area-inset-top,0px));z-index:97;display:none;gap:8px;flex-wrap:wrap;justify-content:flex-end}#edbar .btn{background:var(--night);padding:11px 14px}#edbar .btn.fill{background:var(--gold)}
#tools{display:none;position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:98;background:#0b1d36f5;color:var(--cream);border:1px solid var(--gold);padding:12px;gap:10px;flex-wrap:wrap;align-items:center;max-height:42vh;overflow:auto;box-shadow:0 14px 50px #000a;font-size:10px}
.editing #tools{display:flex}#tools select,#tools button{font:inherit;letter-spacing:.08em;background:#16294a;color:var(--cream);border:1px solid #f6f4ea44;padding:7px 9px;cursor:pointer;text-transform:none}
#tools label{display:flex;gap:6px;align-items:center}#tools input[type=color]{width:34px;height:28px;border:0;padding:0;background:none;cursor:pointer}#tools .sep{width:1px;height:26px;background:#f6f4ea33}#tsel{color:var(--gold);min-width:140px}
.editing [data-k]{outline:1px dashed var(--gold);outline-offset:3px;cursor:text;min-width:10px}.editing .rv{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

.ka{margin-top:64px;border-top:1px solid #14213a30;padding-top:34px}.ka ul{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:16px 44px}@media(max-width:800px){.ka ul{grid-template-columns:1fr}}.ka li{padding-left:24px;position:relative;font-size:17px}.ka li::before{content:"";position:absolute;left:0;top:.7em;width:10px;height:1px;background:var(--acc2)}
#works.empty{display:none}.editing #works.empty{display:block}
.wg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.wc{background:var(--paper2);color:var(--ink);border:1px solid #14213a1f;border-radius:4px;overflow:hidden;transition:.3s}.wc:hover{transform:translateY(-5px);box-shadow:0 18px 40px #0002}
.wi{aspect-ratio:16/10;background:linear-gradient(135deg,#22365a,#12203a);display:grid;place-items:center;color:var(--gold);position:relative;overflow:hidden}.wi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wb{padding:22px}.wb h4{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 8px}.wb p{margin:0 0 12px;color:var(--mute)}.wl{color:var(--acc2);text-decoration:none}
.wed,.wadd,.wempty{display:none}.editing .wed{display:flex;gap:8px;margin-top:12px}.editing .wadd{display:inline-block;margin-top:26px;color:var(--acc2);border-color:var(--acc2)}.editing #works.empty .wempty{display:block;color:var(--mute)}
.wed input{flex:1;min-width:0;padding:8px;border:1px solid #14213a44;background:transparent;color:inherit;font:inherit}.wed button{cursor:pointer;padding:8px 12px;background:none;border:1px solid #b0413e;color:#b0413e}
.editing .wi{cursor:pointer;outline:2px dashed var(--gold);outline-offset:-6px}.dlr{display:none}
.tm{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.tm .c{border:1px solid #f6f4ea22;padding:30px;background:var(--night2);color:var(--cream)}.tm h4{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 14px;color:var(--gold)}.tm p{margin:0 0 18px;font-size:16px;opacity:.92}.tm .by{opacity:.65}
</style>

const okUrl=u=>/^https?:\/\//i.test(u||'');
function workCard(w){const i=w.id;return `<div class="wc rv in"><div class="wi" data-wi="${i}">${w.img?`<img src="${w.img}" alt="">`:'<span class="mono">Tap to add image</span>'}</div><div class="wb"><h4>${E('w'+i+'t')}</h4><p>${E('w'+i+'d')}</p>${okUrl(w.l)?`<a class="wl mono" href="${esc(w.l)}" target="_blank" rel="noopener">View work →</a>`:''}<div class="wed"><input data-wl="${i}" placeholder="Link (optional)" value="${esc(w.l||'')}"><button data-wd="${i}">Remove</button></div></div></div>`}
function renderWorks(){$('wgrid').innerHTML=S.works.map(workCard).join('');$('works').classList.toggle('empty',!S.works.length);document.querySelectorAll('#wgrid [data-k]').forEach(e=>e.contentEditable=isEd()?'true':'false');Object.keys(S.st).forEach(applyStyle)}
let wT=null;
$('works').addEventListener('click',e=>{if(!isEd())return;const wi=e.target.closest('[data-wi]');if(wi){wT=+wi.dataset.wi;$('wfile').click()}const wd=e.target.closest('[data-wd]');if(wd){const i=+wd.dataset.wd;S.works=S.works.filter(w=>w.id!==i);delete S.t['w'+i+'t'];delete S.t['w'+i+'d'];renderWorks()}});
$('works').addEventListener('change',e=>{const i=e.target.dataset&&e.target.dataset.wl;if(!i)return;const w=S.works.find(x=>x.id==i);let v=e.target.value.trim();if(v&&!/^https?:\/\//i.test(v))v='https://'+v;w.l=okUrl(v)?v:'';renderWorks()});
$('wadd').onclick=()=>{const i=++S.wn;S.works.push({id:i,img:'',l:''});S.t['w'+i+'t']='Project title';S.t['w'+i+'d']='A short description of the project and your role.';renderWorks()};
$('wfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f||wT===null)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=900;c.height=560;const r=Math.max(900/im.width,560/im.height),w=im.width*r,h=im.height*r;c.getContext('2d').drawImage(im,(900-w)/2,(560-h)/2,w,h);const wk=S.works.find(x=>x.id===wT);if(wk){wk.img=c.toDataURL('image/jpeg',.82);renderWorks();toast('Image added. Remember to save')}};im.src=URL.createObjectURL(f)};
renderWorks();
(async()=>{try{if(!window.claude||!claude.use)return;const u=await claude.use('user');const ce=!!(u&&u.canEdit());art=await claude.use('artifact');if(ce&&art)bar()}catch(e){}})();
</script>
</body>
</html>
